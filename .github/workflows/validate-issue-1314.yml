name: Validate issue 1314 affected suite
on:
  push:
    branches: [process/validate-issue-1314]
permissions:
  contents: read
jobs:
  full-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec86776f9b68532ac9e968038b7bfccd58967409
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install the project and extensions
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[all]"
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --python .venv/bin/python -e "$ext"
            fi
          done
      - name: Cache the semantic search model
        run: |
          .venv/bin/python - <<'PY'
          from sentence_transformers import SentenceTransformer
          SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2", trust_remote_code=False)
          PY
      - name: Check lint and formatting
        run: |
          .venv/bin/ruff check pyrite/ tests/ extensions/
          .venv/bin/ruff format --check pyrite/ tests/ extensions/
      - name: Run the affected suite on the exact fix commit
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          set -euo pipefail
          scripts/test-affected --run --base 49bfa74dc7166e487bfd3459854a27f850bca010 -n 4 2>&1 | tee core-tests.log
      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1314-core-tests
          path: core-tests.log
